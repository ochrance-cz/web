title: Edice dobré správní praxe
plural: Edice dobré správní praxe
listed: false
perex: V letech 2009–2011 vydal ombudsman ve spolupráci s Ministerstvem vnitra ČR tři publikace s doporučeními pro obce a města. Srozumitelné otázky a odpovědi s návodem, jak v dané situaci postupovat, doplněné o příklady z praxe, využijí větší města i malé obce, ale také občané, kteří se z nich poučí o svých právech.
