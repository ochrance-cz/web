title: Výroční zpráva
plural: Výroční zprávy
listed: true
perex: Ombudsman má povinnost předložit vždy do 31. 3. Poslanecké sněmovně
  zprávu o své činnosti. Její součástí jsou i doporučení ombudsmana k přijetí
  nebo změně právních předpisů nebo k systémovému řešení zjištěných problémů.
  Poslanecká sněmovna obvykle po projednání zprávy ukládá vládě, aby se
  doporučeními ombudsmana zabývala.
illustration: https://cdn.nuasite.com/assets/ochrance-web-lj8h86/media/vystupy/vyrocni-zprava/vyrocni-zpravy.jpg
