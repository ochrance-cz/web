title: Díl seriálu na ČT
plural: Seriál na ČT
listed: true
perex: Od roku 2005 ombudsman spolupracuje s Českou televizí na natáčení
  speciálního publicistického pořadu, který ukazuje některé případy, jimiž se
  ombudsman zabýval, ale také divákům vysvětluje, jak by měli v obdobné situaci
  postupovat. V průběhu let se na výrobě pořadu podílelo víc režisérů,
  scénáristů, pořad měnil podobu i název.
illustration: https://cdn.nuasite.com/assets/ochrance-web-lj8h86/media/vystupy/tv/serial-03.JPG
