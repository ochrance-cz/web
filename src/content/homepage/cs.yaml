situationsTitle: Potřebuji pomoc
cinnostTitle: Činnost ombudsmana
activities:
  - href: /info/setreni/
    icon: arrow
    title: Jak probíhá šetření?
    hp: Zjistěte, jak ombudsman postupuje, když dostane stížnost na úřad, na
      diskriminaci nebo jak provádí návštěvy v zařízení, kde jsou lidé omezeni
      na svobodě.
  - href: /vystupy/
    icon: arrow
    title: Výstupy z činností
    hp: Zprávy pro Poslaneckou sněmovnu, výzkumy a doporučení, zprávy z návštěv
      zařízení, připomínky k zákonům, vyjádření pro vládu aj. Nejdůležitější
      výstupy najdete na jednom místě.
  - href: /vzdelavaci-akce/
    icon: arrow
    title: Vzdělávací akce
    hp: Ombudsman pořádá v rámci osvětové činnosti konference, semináře a diskuzní
      kulaté stoly.
  - href: /eso/
    icon: eso
    title: Evidence stanovisek ombudsmana (ESO)
    hp: ESO je prohledávatelná databáze vydaných stanovisek ombudsmana.
