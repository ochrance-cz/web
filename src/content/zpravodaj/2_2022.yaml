title: Zpravodaj ombudsmana 2/2022
month: 2
year: 2022
author: Přejeme příjemné čtení.
file: https://cdn.nuasite.com/assets/ochrance-web-lj8h86/zpravodaj/2_2022/zpravodaj-ombudsmana-2-2022.pdf
perex: V tomto zpravodaji máte možnost nahlédnout do pestrého výběru případů, kterými se ombudsman zabýval a jejich šetření skončilo v březnu nebo v dubnu roku 2022. Řešily se třeba důchody, maturity, těžba, děti, doktoři a dětští doktoři.
