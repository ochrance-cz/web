name: Deploy to Cloudflare

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1-5'

permissions:
  contents: read

jobs:
  deploy:
    # Production deploys from the office's public repository; the manGoweb
    # working copy only prepares changes.
    if: github.repository == 'ochrance-cz/web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name. See cloudflare/README.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build
        env:
          DEPLOY_TARGET: cloudflare
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run verify:file-urls

      # Static assets are uploaded by content hash, so only changed files travel.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.jsonc
